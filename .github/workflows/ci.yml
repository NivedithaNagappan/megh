name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # Lerna 10 needs Node 22.22+, so the checks call the workspace scripts
      # through npm and run on every supported Node version.
      - run: npm ci
      # Build first: @meghjs/data type-checks and tests against core's dist.
      # npm runs workspaces alphabetically, so core builds before data.
      - name: Build
        run: npm run build --workspaces --if-present
      - name: Type-check
        run: npm run typecheck --workspaces --if-present
      - name: Lint
        run: npm run lint --workspaces --if-present
      - name: Test
        run: npm test --workspaces --if-present

      - name: Coverage (core)
        if: matrix.node-version == 22
        run: npm run test:coverage --workspace @meghjs/core -- --coverage.reporter=text-summary --coverage.reporter=lcov
      - uses: actions/upload-artifact@v4
        if: matrix.node-version == 22
        with:
          name: coverage-core
          path: packages/core/coverage/
          if-no-files-found: ignore

      - name: Fail if the build changed tracked files
        run: git diff --exit-code

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci --prefix docs
      - run: npm run docs:build

  # The one check that branch protection requires. It passes only when every
  # job above passed, so adding or renaming jobs never needs a settings change.
  ci-ok:
    name: CI OK
    if: always()
    needs: [check, docs]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
        run: echo "All CI jobs passed."
      - name: Some checks failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "::error::One or more CI jobs did not pass: ${{ toJSON(needs) }}"
          exit 1
